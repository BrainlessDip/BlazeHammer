[project]
name = "blazehammer"
version = "1.6.0"
description = "Blaze Hammer is an asynchronous API testing and traffic-generation tool built in Python. It generates dynamic payloads and headers through placeholder injection, supports GET/POST with JSON or form bodies, configurable concurrency, rate limiting, retries, live Rich output, and structured result export."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "faker>=40.37.0",
    "fastapi>=0.115",
    "httpx[http2]>=0.28.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "ruamel.yaml>=0.18",
    "uvicorn>=0.30",
    "websockets>=17.0.1",
]

[project.scripts]
blaze-hammer = "blaze_hammer.cli.main:cli_entry"
bh = "blaze_hammer.cli.main:cli_entry"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blaze_hammer"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:faker.*",
]

[tool.mypy]
python_version = "3.13"
files = ["blaze_hammer"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# User-editable extension surface: intentionally kept beginner-simple.
module = "blaze_hammer.ext.*"
disallow_untyped_defs = false
